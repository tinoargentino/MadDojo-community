name: Inspect published Mac download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.7'
      - name: Fetch exact published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.0-beta.1 --pattern '*mac-arm64.dmg' --dir dist/download
      - name: Inspect quarantined application and signature
        run: uv run --no-project --python 3.11 python scripts/verify_macos_distribution.py --dmg dist/download/MadDojo-0.2.0-beta.1-mac-arm64.dmg --sha256 dea43f3287d7442376b26c80718478fd1c96bc81ae723cfd425c1e5814b42083 --output dist/mac-published-assessment.json --report-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mac-published-assessment
          path: dist/mac-published-assessment.json
