name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native build target (publishing requires all)
        type: choice
        options: [all, windows, macos, linux]
        default: all
      publish:
        description: Publish the verified installer set to GitHub Releases
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-15"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-latest","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      UV_MANAGED_PYTHON: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.7'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libfuse2
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf make diffutils tar curl
      - name: Restore compiled media tools
        id: media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dist/engine/tools
          key: desktop-media-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/desktop/build_ffmpeg.sh') }}
      - name: Compile bundled media tools (Unix)
        if: runner.os != 'Windows' && steps.media-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash packaging/desktop/build_ffmpeg.sh "$PWD/dist/engine/tools" "$PWD/dist/ffmpeg-build"
      - name: Compile bundled media tools (Windows)
        if: runner.os == 'Windows' && steps.media-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash packaging/desktop/build_ffmpeg.sh "$PWD/dist/engine/tools" "$PWD/dist/ffmpeg-build"
      - name: Cache compiled media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: dist/engine/tools
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - name: Bundle portable Python, dependencies, and models
        run: uv run --no-project --python 3.11 python scripts/build_engine.py
      - name: Verify bundled separation and exports
        run: uv run --no-project --python 3.11 python scripts/smoke_engine.py dist/engine
      - run: npm ci
      - run: npm test
      - name: Package desktop application
        run: npm run desktop:pack
      - name: Smoke test desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke_desktop.mjs
      - name: Smoke test desktop (Windows and Mac)
        if: runner.os != 'Linux'
        run: node scripts/smoke_desktop.mjs
      - name: Build installers (Linux)
        if: runner.os == 'Linux'
        run: npm run desktop:dist
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP+'/notarization.p8', Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))"
            export APPLE_API_KEY="$RUNNER_TEMP/notarization.p8"
          fi
          npm run desktop:dist
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run desktop:dist
      - name: Verify Windows installation and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/desktop/*.exe | Select-Object -First 1).FullName
          $installDirectory = Join-Path $env:RUNNER_TEMP 'MadDojoInstalled'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          node scripts/smoke_desktop.mjs "$installDirectory/MadDojo.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          $uninstaller = Join-Path $installDirectory 'Uninstall MadDojo.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS removal failed' }
      - name: Verify read-only Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          volume="$RUNNER_TEMP/MadDojoImage"
          mkdir -p "$volume"
          hdiutil attach dist/desktop/*.dmg -readonly -nobrowse -mountpoint "$volume"
          trap 'hdiutil detach "$volume"' EXIT
          node scripts/smoke_desktop.mjs "$volume/MadDojo.app/Contents/MacOS/MadDojo"
      - name: Verify Debian installation and removal
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/desktop/*.deb
          xvfb-run -a node scripts/smoke_desktop.mjs /opt/MadDojo/maddojo
          sudo dpkg -r maddojo
      - name: Verify AppImage and update download (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node scripts/smoke_desktop.mjs dist/desktop/*.AppImage
          node scripts/smoke_update.mjs dist/desktop/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MadDojo-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.yml
            dist/desktop/*.blockmap
            !dist/desktop/builder-debug.yml
          compression-level: 0
          retention-days: 14

  release:
    needs: desktop
    if: (inputs.publish || startsWith(github.ref, 'refs/tags/v')) && (inputs.platform == '' || inputs.platform == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: MadDojo-desktop-*
          path: dist/release
          merge-multiple: true
      - name: Publish complete installer set and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_desktop.mjs dist/release
