name: Release source distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.7'
      - run: uv run --no-project --python 3.11 python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MadDojo-source
          path: dist/MadDojo*
      - name: Publish tagged source release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/MadDojo.zip dist/MadDojo.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/MadDojo.zip dist/MadDojo.zip.sha256 --verify-tag --generate-notes --title "MadDojo $GITHUB_REF_NAME"
          fi
