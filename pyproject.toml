[project]
name = "maddojo"
version = "0.1.0"
description = "A local music practice room with source separation, precise loops, and microphone takes."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=1.26,<2",
  "soundfile>=0.13,<1",
  "librosa>=0.11,<0.12",
  "demucs==4.0.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv.sources]
torch = { index = "pytorch", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
